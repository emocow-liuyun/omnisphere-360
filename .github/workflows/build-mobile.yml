name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-web:
    name: Lint, Unit Tests & Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm lint
          pnpm test
          pnpm build

  build-android:
    name: Build Android Debug APK (OpenCV JNI)
    needs: test-and-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (manual, auto-accept licenses)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -L --retry 3 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.1.8937393"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

      - name: Cache OpenCV Android SDK
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/opencv-android-sdk
          key: opencv-android-sdk-4.10.0

      - name: Download OpenCV 4.10.0 Android SDK
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/opencv-android-sdk"
          curl -L --retry 3 --retry-delay 5 -o "${{ runner.temp }}/ocv.zip" \
            "https://sourceforge.net/projects/opencvlibrary/files/4.10.0/opencv-4.10.0-android-sdk.zip/download"
          unzip -q "${{ runner.temp }}/ocv.zip" -d "${{ runner.temp }}/opencv-android-sdk"

      - name: Sync Capacitor & Build Debug APK
        env:
          OPENCV_ANDROID_SDK: ${{ runner.temp }}/opencv-android-sdk/OpenCV-android-sdk/sdk/native/jni
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OmniSphere360-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Unsigned IPA (OpenCV)
    needs: test-and-web
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache OpenCV iOS framework
        id: opencv-ios-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/opencv-ios
          key: opencv-ios-framework-4.10.0

      - name: Download OpenCV 4.10.0 iOS Framework
        if: steps.opencv-ios-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/opencv-ios"
          curl -L --retry 3 --retry-delay 5 -o "${{ runner.temp }}/ocv-ios.zip" \
            "https://sourceforge.net/projects/opencvlibrary/files/4.10.0/opencv-4.10.0-ios-framework.zip/download"
          unzip -q "${{ runner.temp }}/ocv-ios.zip" -d "${{ runner.temp }}/opencv-ios"
          find "${{ runner.temp }}/opencv-ios" -maxdepth 3 -name "*.framework" -type d

      - name: Stage OpenCV framework into plugin
        run: |
          SRC="${{ runner.temp }}/opencv-ios"
          DEST="packages/capacitor-omnisphere-stitcher/ios/Frameworks"
          mkdir -p "$DEST"
          FOUND=$(find "$SRC" -maxdepth 4 -name "opencv2.framework" -type d | head -n 1)
          if [ -z "$FOUND" ]; then echo "::error::opencv2.framework not found"; find "$SRC" -maxdepth 3 | head -50; exit 1; fi
          cp -R "$FOUND" "$DEST/"
          ls -la "$DEST"

      - name: Sync Capacitor & Install Pods
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          npx cap sync ios
          grep -n "CapacitorOmnisphereStitcher" ios/App/Podfile

      - name: Build Unsigned iOS Archive
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/OmniSphere360.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            2>&1 | tee build/xcodebuild.log | tail -n 150

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/OmniSphere360.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "App: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qry OmniSphere360-unsigned.ipa Payload
          ls -lh OmniSphere360-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OmniSphere360-ios-unsigned-ipa
          path: build/OmniSphere360-unsigned.ipa
          if-no-files-found: error

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
